<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Mastercommerce by PD|Web & App Development"
    >

    <title>Mastercommerce</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="app">


        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="brand">

                <div class="brand-logo">
                    M
                </div>

                <div class="brand-text">

                    <h2>
                        Mastercommerce
                    </h2>

                    <span>
                        by PD|Web & App Development
                    </span>

                </div>

            </div>


            <button
                class="new-chat"
                id="newChatButton"
            >
                + New chat
            </button>


            <nav class="navigation">

                <button
                    class="nav-item active"
                    data-page="home"
                >
                    <span>⌂</span>
                    Home
                </button>


                <button
                    class="nav-item"
                    data-page="past-papers"
                >
                    <span>▣</span>
                    Past Papers
                </button>


                <button
                    class="nav-item"
                    data-page="about"
                >
                    <span>ⓘ</span>
                    About
                </button>


                <button
                    class="nav-item"
                    data-page="settings"
                >
                    <span>⚙</span>
                    Settings
                </button>

            </nav>


            <div class="sidebar-bottom">

                <strong>
                    Mastercommerce
                </strong>

                <p>
                    Learn smarter.
                </p>

                <small>
                    PD|Web & App Development
                </small>

            </div>

        </aside>



        <!-- =========================
             MAIN
        ========================== -->

        <main class="main">


            <!-- MOBILE HEADER -->

            <header class="mobile-header">

                <button
                    id="menuButton"
                    class="menu-button"
                    aria-label="Open menu"
                >
                    ☰
                </button>


                <div class="mobile-brand">

                    <strong>
                        Mastercommerce
                    </strong>

                    <small>
                        PD|Web & App Development
                    </small>

                </div>

            </header>



            <!-- =========================
                 CHAT
            ========================== -->

            <section class="chat-container">


                <div
                    class="chat-messages"
                    id="chatMessages"
                >


                    <!-- OPENING SCREEN -->

                    <div
                        class="welcome"
                        id="welcome"
                    >

                        <div class="welcome-logo">
                            M
                        </div>


                        <h1>
                            What would you like to learn?
                        </h1>


                        <p>
                            Ask a question about Accounting,
                            Economics or Mathematics.
                        </p>

                    </div>

                </div>



                <!-- =========================
                     INPUT
                ========================== -->

                <div class="input-area">

                    <div class="input-box">

                        <textarea
                            id="chatInput"
                            placeholder="Ask anything..."
                            rows="1"
                            autocomplete="off"
                        ></textarea>


                        <button
                            id="sendButton"
                            class="send-button"
                            aria-label="Send message"
                        >
                            ➤
                        </button>

                    </div>


                    <p class="input-note">
                        Mastercommerce by PD|Web & App Development
                    </p>

                </div>

            </section>

        </main>

    </div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
