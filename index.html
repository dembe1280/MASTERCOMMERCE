<div class="input-area">
    <div class="input-box">

        <!-- Plus button -->
        <button
            class="input-action plus-button"
            id="plusButton"
            type="button"
            aria-label="More options"
            aria-expanded="false"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14"></path>
            </svg>
        </button>

        <!-- Question input -->
        <textarea
            id="questionInput"
            rows="1"
            placeholder="Ask a question about Accounting, Economics or Mathematics..."
        ></textarea>

        <!-- Send button -->
        <button
            class="input-action send-button"
            id="sendButton"
            type="button"
            aria-label="Send"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h13"></path>
                <path d="m13 6 6 6-6 6"></path>
            </svg>
        </button>

    </div>

    <!-- Plus menu -->
    <div class="plus-menu" id="plusMenu">

        <div class="plus-menu-title">
            Add to your question
        </div>

        <button class="plus-option" type="button" data-feature="Upload file">
            <span class="plus-option-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 15V3"></path>
                    <path d="m7 8 5-5 5 5"></path>
                    <path d="M5 13v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5"></path>
                </svg>
            </span>
            <span>
                <strong>Upload file</strong>
                <small>Add a file to your question</small>
            </span>
        </button>

        <button class="plus-option" type="button" data-feature="Add image">
            <span class="plus-option-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                    <circle cx="8.5" cy="9" r="1.5"></circle>
                    <path d="m21 15-4.5-4.5L9 18"></path>
                </svg>
            </span>
            <span>
                <strong>Add image</strong>
                <small>Ask questions about an image</small>
            </span>
        </button>

        <button class="plus-option" type="button" data-feature="Add document">
            <span class="plus-option-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 3h8l4 4v14H6z"></path>
                    <path d="M14 3v5h5"></path>
                    <path d="M9 13h6"></path>
                    <path d="M9 17h6"></path>
                </svg>
            </span>
            <span>
                <strong>Add document</strong>
                <small>Use a document as study material</small>
            </span>
        </button>

        <button class="plus-option" type="button" data-feature="Study materials">
            <span class="plus-option-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"></path>
                    <path d="M4 5.5v15"></path>
                    <path d="M8 7h8"></path>
                    <path d="M8 11h8"></path>
                </svg>
            </span>
            <span>
                <strong>Study materials</strong>
                <small>Add notes or learning material</small>
            </span>
        </button>

    </div>
</div>

<!-- Feature notification -->
<div class="feature-notice" id="featureNotice" aria-hidden="true">
    <div class="feature-notice-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
            <circle cx="12" cy="12" r="9"></circle>
        </svg>
    </div>

    <div class="feature-notice-content">
        <strong>Feature under development</strong>
        <p id="featureNoticeText">
            This feature is currently being developed and will be available in a future version of Mastercommerce.
        </p>
    </div>

    <button
        class="feature-notice-close"
        id="featureNoticeClose"
        type="button"
        aria-label="Close notification"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12"></path>
            <path d="m18 6-12 12"></path>
        </svg>
    </button>
</div>
